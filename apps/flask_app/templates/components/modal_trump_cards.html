<!-- Trump Card Duel Arena Modal -->
<div id="trumpCardModal" class="fixed inset-0 z-50 hidden items-center justify-center p-3 sm:p-4 bg-black/85 backdrop-blur-md animate-fade-in select-none">
  <div class="relative w-full max-w-4xl max-h-[92vh] bg-atlas-card border border-atlas-border rounded-2xl shadow-2xl flex flex-col overflow-hidden text-atlas-text">
    <div class="p-4 border-b border-atlas-border flex items-center justify-between bg-atlas-elevated/40">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-saffron/15 text-saffron flex items-center justify-center font-bold">
          <i data-lucide="trophy" class="w-5 h-5"></i>
        </div>
        <div>
          <h3 class="font-serif font-black text-base sm:text-lg text-atlas-text">
            District Hydrological Duel Arena — Trump Cards
          </h3>
          <p class="text-xs text-atlas-muted">Head-to-head empirical confrontation across 6 critical hydrological indicators</p>
        </div>
      </div>
      <button onclick="window.JalSuraksha.closeModal('trumpCardModal')" class="p-1.5 rounded-lg text-atlas-muted hover:text-atlas-text hover:bg-atlas-elevated transition">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <div class="p-4 sm:p-6 overflow-y-auto space-y-6 flex-1 text-xs">
      <!-- Selectors for Challenger A and Challenger B -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- District A -->
        <div class="p-3.5 rounded-xl bg-atlas-elevated/50 border border-atlas-border space-y-2">
          <label class="text-[11px] font-bold text-atlas-muted uppercase block">Challenger District A</label>
          <select id="duelDistrictASelect" onchange="runDistrictDuel()" class="w-full px-3 py-1.5 rounded-lg bg-atlas-card border border-atlas-border text-xs text-atlas-text font-bold">
            {% for d in districts %}
              <option value="{{ d.id }}" {% if d.id == selected_district.id %}selected{% endif %}>{{ d.name }} ({{ d.division | default("Central") }})</option>
            {% endfor %}
          </select>
        </div>

        <!-- District B -->
        <div class="p-3.5 rounded-xl bg-atlas-elevated/50 border border-atlas-border space-y-2">
          <label class="text-[11px] font-bold text-atlas-muted uppercase block">Challenger District B</label>
          <select id="duelDistrictBSelect" onchange="runDistrictDuel()" class="w-full px-3 py-1.5 rounded-lg bg-atlas-card border border-atlas-border text-xs text-atlas-text font-bold">
            {% for d in districts %}
              <option value="{{ d.id }}" {% if loop.index == 2 %}selected{% endif %}>{{ d.name }} ({{ d.division | default("Central") }})</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <!-- Comparison Cards Arena -->
      <div id="duelComparisonGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>

      <!-- Duel Outcome Banner -->
      <div id="duelResultBanner" class="p-4 rounded-xl bg-saffron/10 border border-saffron/30 text-center space-y-1">
        <div class="text-[10px] text-saffron uppercase font-bold tracking-wider">Hydrological Resilience Analysis</div>
        <div id="duelWinnerText" class="text-sm font-serif font-black text-atlas-text">Select districts above to trigger confrontation</div>
      </div>
    </div>
  </div>
</div>

<script>
  function runDistrictDuel() {
    const idA = document.getElementById("duelDistrictASelect")?.value || "agra";
    const idB = document.getElementById("duelDistrictBSelect")?.value || "saharanpur";
    const districts = window.JalSuraksha.state.districts;

    const dA = districts.find(d => d.id === idA) || districts[0];
    const dB = districts.find(d => d.id === idB) || districts[1];

    const mA = dA.modernWaterMetrics || {};
    const mB = dB.modernWaterMetrics || {};

    let scoreA = 0;
    let scoreB = 0;

    // Metrics to compare (better is higher or lower depending on metric)
    const metrics = [
      { name: "Groundwater Table Depth", valA: mA.groundwaterDepthM || 14.5, valB: mB.groundwaterDepthM || 14.5, unit: "m bgl", lowerBetter: true },
      { name: "10-Year Annual Trend", valA: mA.groundwaterTrendAnnualCm || -22, valB: mB.groundwaterTrendAnnualCm || -22, unit: "cm/yr", lowerBetter: false },
      { name: "Stage of Extraction", valA: mA.cgwbStageExtractionPct || 85, valB: mB.cgwbStageExtractionPct || 85, unit: "%", lowerBetter: true },
      { name: "Recharge Suitability", valA: dA.rechargeSuitabilityScore || 75, valB: dB.rechargeSuitabilityScore || 75, unit: "/100", lowerBetter: false },
      { name: "Water Quality Index", valA: (dA.waterQuality && dA.waterQuality.wqi) || 75, valB: (dB.waterQuality && dB.waterQuality.wqi) || 75, unit: "WQI", lowerBetter: false },
      { name: "Annual Normal Rainfall", valA: mA.avgRainfallMm || 850, valB: mB.avgRainfallMm || 850, unit: "mm", lowerBetter: false }
    ];

    const gridEl = document.getElementById("duelComparisonGrid");
    if (!gridEl) return;

    gridEl.innerHTML = `
      <!-- Card A -->
      <div class="p-4 rounded-xl bg-atlas-elevated/40 border border-atlas-border space-y-3">
        <div class="border-b border-atlas-border pb-2">
          <div class="text-base font-serif font-black text-emerald-400">${dA.name}</div>
          <div class="text-[11px] text-atlas-muted">${dA.division || "Central"} • ${mA.majorRiverBasin || "Basin"}</div>
        </div>
        <div class="space-y-2">
          ${metrics.map(m => {
            const winA = m.lowerBetter ? m.valA < m.valB : m.valA > m.valB;
            if (winA) scoreA++;
            return `
              <div class="flex justify-between items-center text-xs p-1.5 rounded-lg ${winA ? 'bg-emerald-500/15 font-bold text-emerald-400' : 'text-atlas-muted'}">
                <span>${m.name}</span>
                <span class="font-mono">${m.valA} ${m.unit}</span>
              </div>
            `;
          }).join("")}
        </div>
      </div>

      <!-- Card B -->
      <div class="p-4 rounded-xl bg-atlas-elevated/40 border border-atlas-border space-y-3">
        <div class="border-b border-atlas-border pb-2">
          <div class="text-base font-serif font-black text-saffron">${dB.name}</div>
          <div class="text-[11px] text-atlas-muted">${dB.division || "Central"} • ${mB.majorRiverBasin || "Basin"}</div>
        </div>
        <div class="space-y-2">
          ${metrics.map(m => {
            const winB = m.lowerBetter ? m.valB < m.valA : m.valB > m.valA;
            if (winB) scoreB++;
            return `
              <div class="flex justify-between items-center text-xs p-1.5 rounded-lg ${winB ? 'bg-emerald-500/15 font-bold text-emerald-400' : 'text-atlas-muted'}">
                <span>${m.name}</span>
                <span class="font-mono">${m.valB} ${m.unit}</span>
              </div>
            `;
          }).join("")}
        </div>
      </div>
    `;

    const winnerName = scoreA > scoreB ? dA.name : scoreB > scoreA ? dB.name : "Draw";
    const bannerEl = document.getElementById("duelWinnerText");
    if (bannerEl) {
      if (winnerName === "Draw") {
        bannerEl.textContent = `Equal Hydrological Resilience Match (${scoreA} – ${scoreB})`;
      } else {
        bannerEl.textContent = `🏆 ${winnerName} exhibits superior hydrological resilience (${Math.max(scoreA, scoreB)} – ${Math.min(scoreA, scoreB)} parameters won)`;
      }
    }
  }

  // Auto run duel when modal opens
  document.addEventListener("DOMContentLoaded", () => {
    setTimeout(runDistrictDuel, 500);
  });
</script>

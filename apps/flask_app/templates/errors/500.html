{% extends "base.html" %}

{% block title %}500 — Processing Error • JalSuraksha{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col items-center justify-center p-6 bg-atlas-canvas text-atlas-text text-center">
  <div class="max-w-md w-full p-8 rounded-2xl bg-atlas-card border border-atlas-border shadow-2xl space-y-5">
    <div class="w-16 h-16 mx-auto rounded-2xl bg-purple-500/15 border border-purple-500/30 text-purple-400 flex items-center justify-center">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
    </div>
    
    <div>
      <span class="text-xs font-mono font-bold px-2 py-0.5 rounded bg-atlas-elevated text-purple-400 border border-atlas-border">HTTP 500</span>
      <h1 class="text-2xl font-serif font-black text-atlas-text mt-2">Server Error</h1>

        An error occurred during hydrological calculation or model inference. Telemetry logs have been captured.
      </p>
    </div>

    <div class="pt-2">
      <a href="/" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-glow transition">

        <span>Return to JalSuraksha Atlas</span>
      </a>
    </div>
  </div>
</div>
{% endblock %}

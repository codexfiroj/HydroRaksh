{% extends "base.html" %}

{% block title %}400 — Bad Request • JalSuraksha{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col items-center justify-center p-6 bg-atlas-canvas text-atlas-text text-center">
  <div class="max-w-md w-full p-8 rounded-2xl bg-atlas-card border border-atlas-border shadow-2xl space-y-5">
    <div class="w-16 h-16 mx-auto rounded-2xl bg-rose-500/15 border border-rose-500/30 text-rose-400 flex items-center justify-center">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    </div>
    
    <div>
      <span class="text-xs font-mono font-bold px-2 py-0.5 rounded bg-atlas-elevated text-rose-400 border border-atlas-border">HTTP 400</span>
      <h1 class="text-2xl font-serif font-black text-atlas-text mt-2">Bad Request</h1>
      <p class="text-xs text-atlas-muted mt-2">
        {{ error }}
      </p>
    </div>

    <div class="pt-2">
      <a href="/" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-glow transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span>Return to JalSuraksha Atlas</span>
      </a>
    </div>
  </div>
</div>
{% endblock %}

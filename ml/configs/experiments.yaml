# JalSuraksha ML Research Experiments & Hyperparameter Configurations

forecasting:
  random_seed: 42
  test_size_days: 90
  rolling_origin_folds: 4
  min_history_days: 180
  confidence_interval_alpha: 0.10  # 90% prediction intervals

  models:
    persistence:
      name: "PersistenceBaseline"
      horizon_days: [30, 60, 90]

    seasonal_naive:
      name: "SeasonalNaiveBaseline"
      seasonality_days: 365

    ridge:
      name: "RidgeRegression"
      alpha: 1.0
      fit_intercept: true

    random_forest:
      name: "RandomForestRegressor"
      n_estimators: 100
      max_depth: 8
      min_samples_split: 5
      random_state: 42
      n_jobs: -1

    gradient_boosting:
      name: "GradientBoostingRegressor"
      n_estimators: 120
      learning_rate: 0.05
      max_depth: 5
      subsample: 0.85
      random_state: 42

hg_cf:
  random_seed: 42
  n_factors: 8
  learning_rate: 0.008
  reg_latent: 0.02
  reg_laplacian: 0.05
  n_iterations: 35
  rbf_gamma: 0.5
  similarity_threshold: 0.35
  top_k_recommendations: 5
  cold_start_k_neighbors: 3

lda_topic_model:
  random_seed: 42
  num_topics: 6
  max_features: 1500
  min_df: 2
  max_df: 0.85
  max_iter: 25
  learning_method: "batch"
  topic_labels:
    0: "Over-Exploitation & Critical Stress"
    1: "Artificial Recharge & Rainwater Harvesting"
    2: "Alluvial & Aquifer Hydrogeology"
    3: "Water Quality & Chemical Contamination"
    4: "Irrigation Demands & Agricultural Stress"
    5: "Policy, Micro-Irrigation & Sustainable Management"

evaluation_metrics:
  forecasting:
    - "mae"
    - "rmse"
    - "mape"
    - "r2"
    - "coverage_90"
  recommendation:
    - "precision@k"
    - "recall@k"
    - "ndcg@k"
    - "hydrogeological_coherence"

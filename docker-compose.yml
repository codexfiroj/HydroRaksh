version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jalsuraksha_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PORT=5000
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 3

  research:
    profiles: ["research"]
    build:
      context: .
      dockerfile: Dockerfile.research
    container_name: jalsuraksha_research
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_TOKEN=jalsuraksha-research
    volumes:
      - ./ml:/workspace/ml
      - ./data:/workspace/data
      - ./services:/workspace/services

volumes:
  app_data:
  research_artifacts:
